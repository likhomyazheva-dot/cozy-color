<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cozy Color — первая картина</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#eee9df}
header{height:64px;background:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;z-index:5}
#status{font-size:12px;color:#666}.spacer{flex:1}button{padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}
#wrap{position:absolute;top:64px;bottom:105px;left:0;right:0;overflow:hidden;touch-action:none}
#board{position:absolute;left:50%;top:50%;width:min(92vw,720px);aspect-ratio:4/5;background:#fff;touch-action:none;transform-origin:center;box-shadow:0 8px 28px #0002}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#palette{position:absolute;bottom:0;left:0;right:0;height:105px;background:#fff;display:flex;gap:8px;overflow-x:auto;padding:12px;z-index:5}
.sw{flex:0 0 58px;height:70px;border:3px solid transparent;border-radius:14px;background:var(--c);font-weight:700}.sw.sel{border-color:#111;transform:translateY(-3px)}
</style></head><body>
<header><b>Cozy Color · Балкон у моря</b><span id="status">Pencil рисует · 2 пальца масштабируют</span><span class="spacer"></span><button id="clear">Очистить</button></header>
<div id="wrap"><div id="board"><canvas id="paint"></canvas><canvas id="lines"></canvas></div></div><div id="palette"></div>
<script>
const colors=['#f4ead5','#e2c59e','#d99b67','#b96c4b','#8c513b','#6e7f55','#93a87b','#b8d7e7','#76a9c5','#426e91','#e8a3aa','#d76d78','#b74655','#7d2e35','#ddd7cd','#a9a49b','#686864','#343638'];
let selected=0,drawing=false,last=null,scale=1,tx=0,ty=0; const started=new Set();
const paint=document.getElementById('paint'),lines=document.getElementById('lines'),pc=paint.getContext('2d'),lc=lines.getContext('2d'),board=document.getElementById('board'),wrap=document.getElementById('wrap');
const regions=[];
function R(n,pts,label){regions.push({n:n-1,pts,label})}
R(8,[[0,0],[720,0],[720,210],[0,210]],[360,90]); R(9,[[0,210],[720,210],[720,420],[0,420]],[470,310]);
R(1,[[0,0],[175,0],[165,800],[0,800]],[75,360]); R(2,[[175,0],[260,0],[250,800],[165,800]],[210,410]);
R(6,[[250,0],[360,0],[340,210],[260,210]],[305,100]); R(7,[[360,0],[480,0],[470,210],[340,210]],[410,100]);
R(11,[[480,0],[720,0],[720,75],[505,100]],[610,35]);
R(15,[[505,100],[720,75],[720,210],[585,185]],[650,145]);
R(10,[[430,210],[720,210],[720,420],[610,390],[535,330]],[620,270]);
R(16,[[0,420],[160,395],[220,470],[190,610],[0,650]],[85,520]);
R(6,[[160,395],[330,365],[380,500],[220,470]],[270,420]);
R(3,[[330,365],[535,330],[610,390],[520,510],[380,500]],[455,420]);
R(5,[[0,650],[190,610],[310,670],[250,800],[0,800]],[115,720]);
R(4,[[190,610],[380,500],[520,510],[480,700],[310,670]],[365,600]);
R(12,[[520,510],[720,420],[720,650],[590,675],[480,700]],[610,570]);
R(13,[[250,800],[310,670],[480,700],[510,800]],[390,750]);
R(14,[[510,800],[480,700],[590,675],[720,650],[720,800]],[610,740]);
R(17,[[260,210],[340,210],[330,365],[160,395],[165,300]],[245,300]);
R(18,[[165,300],[160,395],[0,420],[0,210],[165,210]],[80,315]);

function pathOf(r){let p=new Path2D();p.moveTo(r.pts[0][0],r.pts[0][1]);for(let i=1;i<r.pts.length;i++)p.lineTo(r.pts[i][0],r.pts[i][1]);p.closePath();return p}
function setup(){let d=Math.min(devicePixelRatio||1,2);[paint,lines].forEach(c=>{c.width=720*d;c.height=800*d;c.getContext('2d').setTransform(d,0,0,d,0,0)});drawLines()}
function drawLines(){lc.clearRect(0,0,720,800);lc.strokeStyle='#777';lc.lineWidth=1.2;lc.font='14px Georgia';lc.textAlign='center';lc.textBaseline='middle';regions.forEach((r,i)=>{lc.stroke(pathOf(r));if(!started.has(i)){lc.fillStyle='#777';lc.fillText(r.n+1,r.label[0],r.label[1])}})
function hit(x,y){for(let i=regions.length-1;i>=0;i--){if(lc.isPointInPath(pathOf(regions[i]),x,y))return {r:regions[i],i}}return null}
function dot(x,y){let h=hit(x,y);if(!h||h.r.n!==selected)return;if(!started.has(h.i)){started.add(h.i);drawLines()}pc.save();pc.clip(pathOf(h.r));pc.fillStyle=colors[selected];pc.beginPath();pc.arc(x,y,19,0,Math.PI*2);pc.fill();pc.restore()}
function local(e){let r=paint.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*800/r.height}}
paint.addEventListener('pointerdown',e=>{if(e.pointerType==='pen'){e.preventDefault();drawing=true;last=local(e);dot(last.x,last.y);paint.setPointerCapture(e.pointerId)}},{passive:false});
paint.addEventListener('pointermove',e=>{if(!drawing||e.pointerType!=='pen')return;e.preventDefault();let p=local(e),dx=p.x-last.x,dy=p.y-last.y,N=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5));for(let i=1;i<=N;i++)dot(last.x+dx*i/N,last.y+dy*i/N);last=p},{passive:false});
paint.addEventListener('pointerup',e=>{drawing=false;last=null},{passive:false}); lines.style.pointerEvents='none';
let sd=0,ss=1,sm=null,stx=0,sty=0;wrap.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1];sd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);ss=scale;sm={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};stx=tx;sty=ty}},{passive:false});
wrap.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),m={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};scale=Math.max(.8,Math.min(5,ss*d/sd));tx=stx+m.x-sm.x;ty=sty+m.y-sm.y;apply()}},{passive:false});
function apply(){board.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`}
const pal=document.getElementById('palette');colors.forEach((c,i)=>{let b=document.createElement('button');b.className='sw'+(i===0?' sel':'');b.style.setProperty('--c',c);b.textContent=i+1;b.onclick=()=>{selected=i;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};pal.appendChild(b)});
document.getElementById('clear').onclick=()=>{pc.clearRect(0,0,720,800);started.clear();drawLines()};setup();apply();
</script></body></html>
