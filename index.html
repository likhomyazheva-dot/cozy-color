<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cozy Color v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#eee9df}
header{height:64px;background:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}
#status{font-size:12px;color:#666}.spacer{flex:1}button{padding:9px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}
#wrap{position:absolute;top:64px;bottom:105px;left:0;right:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#board{position:relative;width:min(92vw,680px);aspect-ratio:2/3;background:#fff;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#palette{position:absolute;bottom:0;left:0;right:0;height:105px;background:#fff;display:flex;gap:8px;overflow-x:auto;padding:12px}
.sw{flex:0 0 58px;height:70px;border:3px solid transparent;border-radius:14px;background:var(--c);font-weight:700}
.sw.sel{border-color:#111}
</style></head>
<body>
<header><b>Cozy Color v3</b><span id="status">Коснись Pencil белой области</span><span class="spacer"></span><button id="clear">Очистить</button></header>
<div id="wrap"><div id="board"><canvas id="c"></canvas></div></div>
<div id="palette"></div>
<script>
const colors=['#f1ead6','#dfc7a3','#dda36f','#edc49c','#bd8a63','#a96340','#a34e32','#788865','#879976','#526340','#a8c7d6','#8eabc4','#5b7d9c','#e9b0b5','#d77b86','#bf5365','#982d36','#c8c5bf','#9c9c99','#353535'];
let selected=0,drawing=false,last=null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),status=document.getElementById('status');
const pal=document.getElementById('palette');
colors.forEach((col,i)=>{let b=document.createElement('button');b.className='sw'+(i===0?' sel':'');b.style.setProperty('--c',col);b.textContent=i+1;b.onclick=()=>{selected=i;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');drawGrid()};pal.appendChild(b)});

function setup(){
 let r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);drawGrid();
}
function drawGrid(){
 let w=cv.clientWidth,h=cv.clientHeight,cols=5,rows=8;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.font='14px -apple-system';ctx.textAlign='center';ctx.textBaseline='middle';
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
   let cw=w/cols,ch=h/rows,n=(x+y*2)%20;
   ctx.strokeRect(x*cw+2,y*ch+2,cw-4,ch-4);
   ctx.fillStyle='#777';ctx.fillText(n+1,(x+.5)*cw,(y+.5)*ch);
 }
}
function cell(x,y){
 let w=cv.clientWidth,h=cv.clientHeight,cols=5,rows=8;
 let cx=Math.floor(x/(w/cols)),cy=Math.floor(y/(h/rows));
 if(cx<0||cy<0||cx>=cols||cy>=rows)return null;
 return {cx,cy,n:(cx+cy*2)%20,cw:w/cols,ch:h/rows};
}
function dot(x,y){
 let q=cell(x,y); if(!q || q.n!==selected)return;
 ctx.save();ctx.beginPath();ctx.rect(q.cx*q.cw+3,q.cy*q.ch+3,q.cw-6,q.ch-6);ctx.clip();
 ctx.fillStyle=colors[selected];ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.restore();
}
function pos(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function down(e){
 e.preventDefault(); status.textContent='Получено: '+e.type+(e.pointerType?' / '+e.pointerType:'');
 drawing=true;last=null;let p=pos(e);dot(p.x,p.y);last=p;
}
function move(e){
 if(!drawing)return;e.preventDefault();let p=pos(e);
 let dx=p.x-last.x,dy=p.y-last.y,N=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4));
 for(let i=1;i<=N;i++)dot(last.x+dx*i/N,last.y+dy*i/N);
 last=p;
}
function up(e){drawing=false;last=null;if(e)e.preventDefault()}
if(window.PointerEvent){
 cv.addEventListener('pointerdown',down,{passive:false});
 cv.addEventListener('pointermove',move,{passive:false});
 window.addEventListener('pointerup',up,{passive:false});
}else{
 cv.addEventListener('touchstart',e=>{let t=e.changedTouches[0];down(t)},{passive:false});
 cv.addEventListener('touchmove',e=>{let t=e.changedTouches[0];move(t)},{passive:false});
 cv.addEventListener('touchend',up,{passive:false});
}
document.getElementById('clear').onclick=setup;
window.addEventListener('resize',setup);setup();
</script></body></html>
